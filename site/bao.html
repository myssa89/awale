<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bao</title>
<meta name="description" content="Learn and play Bao, the great seed game of East Africa: a 1-minute video, lessons and a friendly computer opponent. Learners' rules (Bao la Kujifunza). EN / FR / DE / IT.">
<meta name="theme-color" content="#2c3c9e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238b4a28'/%3E%3Ccircle cx='20' cy='24' r='9' fill='%233d1d0d'/%3E%3Ccircle cx='44' cy='24' r='9' fill='%233d1d0d'/%3E%3Ccircle cx='20' cy='44' r='9' fill='%233d1d0d'/%3E%3Ccircle cx='44' cy='44' r='9' fill='%233d1d0d'/%3E%3Ccircle cx='44' cy='44' r='4' fill='%23e4dfd2'/%3E%3Ccircle cx='20' cy='24' r='4' fill='%23e4dfd2'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: carved mahogany board on indigo-washed cloth; teaching sidebar to the right, stacked below on phones. */
:root {
  --bg: #e7eaf2;          /* indigo-washed cloth */
  --panel: #f6f7fb;
  --ink: #1a2142;         /* indigo ink */
  --muted: #59617f;
  --line: #cbd0df;
  --accent: #2c3c9e;      /* indigo dye */
  --wood: #8b4a28;
  --wood-hi: #a95f37;
  --wood-lo: #5c2d16;
  --hollow: #3d1d0d;
  --seed-a: #e4dfd2;      /* grey-ivory nicker seeds */
  --seed-b: #b8b2a3;
  --go: #2f9e6a;
  --no: #c8452f;
  --path: #f3e2b3;
  --capture: #ffb21e;
  --on-wood: #f5e6d6;
  --shadow: 0 1px 2px rgba(26, 33, 66, .08), 0 8px 24px rgba(26, 33, 66, .08);

  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --panel: #171b2d; --ink: #e5e8f4; --muted: #9aa1bd; --line: #2b3150;
    --accent: #8f9cf0; --wood: #6f3a1f; --wood-hi: #86492a; --wood-lo: #411f0d; --hollow: #241006;
    --seed-a: #dcd7ca; --seed-b: #a49e90; --go: #4cc48b; --no: #ef6a52; --path: #f1e1b6; --capture: #ffb83a;
    --on-wood: #f5e6d6; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --panel: #171b2d; --ink: #e5e8f4; --muted: #9aa1bd; --line: #2b3150;
  --accent: #8f9cf0; --wood: #6f3a1f; --wood-hi: #86492a; --wood-lo: #411f0d; --hollow: #241006;
  --seed-a: #dcd7ca; --seed-b: #a49e90; --go: #4cc48b; --no: #ef6a52; --path: #f1e1b6; --capture: #ffb83a;
  --on-wood: #f5e6d6; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 16px/1.5 var(--f-body); }
button, select { font: inherit; color: inherit; }

.app {
  max-width: 1200px; margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.topbar { flex: 1 0 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.brand h1 {
  font: 800 clamp(2.2rem, 5vw, 3.2rem)/0.9 var(--f-display);
  letter-spacing: -0.03em; margin: 0; color: var(--ink);
}
.tagline { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }
.modes { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); flex-wrap: wrap; }
.modes button {
  border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  font-weight: 700; font-size: .92rem; color: var(--muted);
}
.modes button[aria-selected="true"] { background: var(--accent); color: var(--panel); }
.modes button:focus-visible, .btn:focus-visible, .pit:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.layout.solo { grid-template-columns: minmax(0, 1fr); max-width: 900px; width: 100%; margin-inline: auto; }

/* move explanation under the board */
.explain { min-height: 3.3em; font-size: 1rem; line-height: 1.45; }
.explain p { margin: 0 0 2px; }
.explain .lead { font-weight: 700; }

/* trap-warnings switch */
.switch {
  margin-left: auto; display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 7px 12px 7px 8px; border-radius: 999px; font-size: .92rem;
}
.switch-track { width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch-knob { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s; }
.switch[aria-checked="true"] .switch-track { background: var(--go); }
.switch[aria-checked="true"] .switch-knob { transform: translateX(16px); }
.switch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 560px) { .switch { margin-left: 0; } }

details.card > summary { cursor: pointer; font-weight: 700; }
.settings-body { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
@media (max-width: 560px) {
  /* Five tabs: let the row scroll sideways instead of squeezing them. */
  .modes { width: 100%; display: flex; flex-wrap: nowrap; overflow-x: auto; border-radius: 14px; scrollbar-width: none; }
  .modes::-webkit-scrollbar { display: none; }
  .modes button { flex: none; padding: 8px 12px; border-radius: 10px; font-size: .85rem; white-space: nowrap; }
  .cap { font-size: .62rem; padding: 2px 4px; white-space: normal; width: max-content; max-width: 104%; text-align: center; line-height: 1.05; }
}

/* ---------- difficulty ---------- */
.difficulty { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.seg button {
  border: 0; background: transparent; cursor: pointer; padding: 8px 18px; border-radius: 9px;
  font: 700 1rem/1 var(--f-display); color: var(--muted);
}
.seg button[aria-pressed="true"] { color: var(--panel); }
#lvl-easy[aria-pressed="true"] { background: var(--go); }
#lvl-medium[aria-pressed="true"] { background: var(--accent); }
#lvl-hard[aria-pressed="true"] { background: var(--no); }
.seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.difficulty-note { color: var(--muted); font-size: .9rem; flex: 1 1 220px; min-width: 0; }

/* ---------- who plays ---------- */
.matchup { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font: 700 clamp(1.1rem, 2.6vw, 1.35rem)/1.2 var(--f-display); }
.who { display: inline-flex; align-items: center; gap: 8px; font: 800 clamp(1.15rem, 2.8vw, 1.45rem)/1.2 var(--f-display); color: var(--ink); min-width: 0; }
.who-btn { border: 1px solid var(--line); background: var(--panel); padding: 5px 12px 5px 6px; border-radius: 999px; cursor: pointer; }
.who-btn:hover { border-color: var(--accent); }
.who-text { color: var(--muted); }
.caret { color: var(--muted); font-size: .8em; }
.avatar {
  --av: var(--accent);
  display: inline-grid; place-items: center; flex: none; width: 1.7em; height: 1.7em; border-radius: 30%;
  background: var(--av); color: #fff; font: 800 1em/1 var(--f-display);
}
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.profile {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 5px 12px 5px 5px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font: 700 .95rem/1 var(--f-body); color: var(--ink);
}
.profile .avatar { width: 30px; height: 30px; font-size: .95rem; }
.profile:hover, .who-btn:hover { border-color: var(--accent); }
.profile:focus-visible, .who-btn:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-width: 560px) { .top-right { width: 100%; } }

/* ---------- welcome: who's playing ---------- */
body.welcoming { overflow: hidden; }
.welcome {
  position: fixed; inset: 0; z-index: 50; overflow-y: auto; background: var(--bg);
  padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.welcome-inner { min-height: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.welcome-brand { margin: 0; font: 800 1.1rem/1 var(--f-display); letter-spacing: -0.01em; color: var(--muted); }
.welcome-title { margin: 0; font: 800 clamp(2rem, 6vw, 3.2rem)/1.05 var(--f-display); letter-spacing: -0.03em; text-wrap: balance; }
.welcome-sub { margin: 0 0 10px; color: var(--muted); font-size: 1.05rem; }
.welcome-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 3vw, 26px); }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: clamp(96px, 22vw, 136px);
  background: none; border: 0; padding: 6px; cursor: pointer; color: var(--ink); border-radius: 18px;
}
.avatar.big { width: 100%; height: auto; aspect-ratio: 1; border-radius: 22%; font-size: clamp(2.4rem, 8vw, 3.6rem); transition: transform .15s ease, box-shadow .15s ease; }
.tile:hover .avatar.big, .tile:focus-visible .avatar.big { transform: translateY(-3px); box-shadow: 0 0 0 4px var(--panel), 0 0 0 7px var(--ink); }
.avatar.plus { background: transparent; color: var(--muted); border: 3px dashed var(--line); font-weight: 400; }
.tile-name { font: 700 1.05rem/1.2 var(--f-display); max-width: 100%; overflow-wrap: anywhere; }
.tile-meta { color: var(--muted); font-size: .8rem; margin-top: -4px; }
.welcome-form { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; max-width: 440px; margin-top: 6px; }
.welcome-form input {
  flex: 1 1 200px; min-width: 0; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--accent);
  background: var(--panel); color: var(--ink); font: 700 1.2rem/1.2 var(--f-display);
}
.welcome-form .btn { font-size: 1.05rem; padding: 12px 20px; }
.welcome-error { margin: 0; min-height: 1.4em; color: var(--no); font-weight: 700; }

/* ---------- games played ---------- */
.summary-note { font-weight: 400; color: var(--muted); }
.games-body { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.games-stats { margin: 0; }
.games-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.games-list li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-variant-numeric: tabular-nums; }
.g-res { font: 700 .74rem/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 0; text-align: center; border-radius: 999px; }
.g-won { background: color-mix(in srgb, var(--go) 22%, var(--panel)); }
.g-lost { background: color-mix(in srgb, var(--no) 18%, var(--panel)); }
.g-draw { background: var(--line); }
.g-meta { color: var(--muted); font-size: .85rem; }
.games-msg { margin: 0; color: var(--muted); font-size: .9rem; }
.copybox { display: block; width: 100%; height: 120px; margin-top: 6px; font: 400 .75rem/1.3 var(--f-mono); }

/* ---------- status ---------- */
.table { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.status {
  font: 700 clamp(1.15rem, 2.4vw, 1.45rem)/1.25 var(--f-display); letter-spacing: -0.01em;
  min-height: 1.8em; display: flex; align-items: center; gap: 10px; text-wrap: balance;
}
.status .chip {
  font: 700 .72rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase;
  padding: 5px 9px; border-radius: 999px; background: var(--accent); color: var(--panel); flex: none;
}
.status .chip.north { background: var(--wood); color: var(--on-wood); }
.status .chip.done { background: var(--go); color: #fff; font-size: .95rem; padding: 6px 10px; }
.status .chip.retry { background: var(--capture); color: var(--hollow); font-size: .95rem; padding: 6px 10px; }
.status { flex-wrap: wrap; }
.status-btn { font: 700 1rem/1 var(--f-body); padding: 10px 16px; margin-left: 4px; }
.status .chip.name { text-transform: none; letter-spacing: 0; font-size: .95rem; padding: 6px 11px; }
.thinking::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

/* ---------- board ---------- */
.board {
  position: relative;
  display: grid; grid-template-columns: minmax(64px, .16fr) minmax(0, 1fr) minmax(64px, .16fr); gap: clamp(8px, 1.5vw, 16px);
  padding: clamp(10px, 2vw, 22px);
  border-radius: clamp(18px, 4vw, 48px);
  background:
    repeating-linear-gradient(97deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(93deg, rgba(0, 0, 0, .06) 0 1px, transparent 1px 23px),
    linear-gradient(180deg, var(--wood-hi), var(--wood) 45%, var(--wood-lo));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .18), inset 0 -4px 0 rgba(0, 0, 0, .25), var(--shadow);
}
.rows { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(5px, 1.2vw, 12px); }
.direction { display: flex; justify-content: center; color: var(--on-wood); opacity: .6; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
.direction span::before { content: "\2190  "; }
.direction span::after { content: "  \2192"; }

.pit, .store-well {
  position: relative;
  background: radial-gradient(circle at 50% 38%, var(--hollow) 0 55%, color-mix(in srgb, var(--hollow) 70%, var(--wood)) 100%);
  box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), inset 0 -2px 3px rgba(255, 255, 255, .12), 0 1px 0 rgba(255, 255, 255, .15);
}
.pit {
  aspect-ratio: 1; width: 100%; max-width: 100%;
  border: 0; border-radius: 50%; padding: 0; cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}
.pit > * { pointer-events: none; }
.pit .seeds, .store-well .seeds { position: absolute; inset: 14%; }
.seed {
  position: absolute; width: 22%; aspect-ratio: 1; border-radius: 50%;
  translate: -50% -50%;
  background: radial-gradient(circle at 35% 30%, var(--seed-a), var(--seed-b) 70%, color-mix(in srgb, var(--seed-b) 70%, #000) 100%);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
}
.count {
  position: absolute; left: 50%; bottom: -4px; translate: -50% 0;
  min-width: 1.9em; padding: 1px 6px; border-radius: 999px;
  font: 700 .82rem/1.3 var(--f-body); font-variant-numeric: tabular-nums;
  background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
}
.row-n .count { bottom: auto; top: -4px; }
.pname {
  position: absolute; top: 4px; left: 6px;
  font: 500 .72rem/1 var(--f-mono); color: var(--on-wood); opacity: .75;
}
.row-n .pname { top: auto; bottom: 4px; }
.order {
  position: absolute; top: 50%; left: 50%; translate: -50% -50%;
  font: 800 clamp(.9rem, 2.2vw, 1.25rem)/1 var(--f-display); color: var(--hollow);
  background: var(--path); border-radius: 999px; min-width: 1.7em; padding: 3px 5px; z-index: 2;
  box-shadow: 0 0 0 2px var(--hollow);
}
.order.multi { font-size: .75rem; }

.pit.legal { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 3px var(--go); }
.pit.legal:hover, .pit.legal.selected { transform: translateY(-2px); box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 4px var(--go), 0 6px 14px rgba(0, 0, 0, .35); }
.pit.illegal { cursor: not-allowed; }
.pit.illegal.mine { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 3px color-mix(in srgb, var(--no) 75%, transparent); }
.pit.illegal.mine::after {
  content: ""; position: absolute; inset: 30%; z-index: 1;
  background:
    linear-gradient(45deg, transparent 44%, var(--no) 44% 56%, transparent 56%),
    linear-gradient(-45deg, transparent 44%, var(--no) 44% 56%, transparent 56%);
  opacity: 0; transition: opacity .15s;
}
.pit.illegal.mine:hover::after, .pit.illegal.mine.selected::after { opacity: .9; }
.pit.path { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 2px var(--path); }
.pit.last { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 2px var(--path), 0 0 0 5px color-mix(in srgb, var(--path) 45%, transparent); }
.pit.capture { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 5px var(--capture), 0 0 22px var(--capture); }
.cap {
  position: absolute; left: 50%; top: 50%; translate: -50% 60%; z-index: 3;
  font: 800 .78rem/1 var(--f-body); white-space: nowrap; padding: 4px 7px; border-radius: 999px;
  background: var(--capture); color: var(--hollow); box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
}
.cap.no { background: var(--no); color: #fff; }
.pit.blocked { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 4px var(--no); }
.pit.source { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 4px var(--go); opacity: .85; }
.pit.active { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 4px var(--path), 0 0 16px var(--path); }
.pit.flash { animation: flash .5s ease 2; }
@keyframes flash { 50% { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 6px var(--capture), 0 0 26px var(--capture); } }
.pit.hint { animation: hint 1.1s ease-in-out 3; }
@keyframes hint { 50% { transform: translateY(-4px); box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 6px var(--accent), 0 0 20px var(--accent); } }
.pit.shake { animation: shake .3s ease; }
@keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }

.rating {
  position: absolute; top: 4px; right: 4px; z-index: 2;
  width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--hollow);
}
.row-n .rating { top: auto; bottom: 4px; }
.rating.win { background: var(--go); }
.rating.safe { background: var(--seed-a); }
.rating.risky { background: var(--no); }

.store { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.store-well { flex: 1; width: 100%; border-radius: 999px; min-height: 120px; }
.store-well .seeds { inset: 10% 14%; }
.store-well .seed { width: 26%; }
.store-label { font: 700 .72rem/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--on-wood); opacity: .85; }
.store-count { font: 800 1.5rem/1 var(--f-display); color: var(--on-wood); font-variant-numeric: tabular-nums; }
.store.bump .store-count { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.35); color: var(--capture); } }
.store.store-n { order: 0; }
.store.store-s { order: 2; }
.rows { order: 1; }

@media (max-width: 620px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .store { flex-direction: row; justify-content: space-between; padding: 0 6px; }
  .store-well { min-height: 0; height: 38px; flex: 1; }
  .store-well .seeds { inset: 12% 4%; }
  .store-well .seed { width: auto; height: 60%; aspect-ratio: 1; }
  .store-count { font-size: 1.25rem; min-width: 1.6em; text-align: right; }
  .store-label { min-width: 4.2em; }
  .count { font-size: .72rem; padding: 0 5px; }

/* ---------- sidebar ---------- */
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.lesson { border-color: var(--accent); }

.dots { display: flex; gap: 5px; list-style: none; margin: 0; padding: 0; }

.mono { font-family: var(--f-mono); font-size: .9em; }
.tag {
  display: inline-block; font: 700 .7rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase;
  padding: 4px 7px; border-radius: 999px; vertical-align: 1px;
}
.tag.best { background: color-mix(in srgb, var(--go) 22%, var(--panel)); color: var(--ink); }
.tag.good { background: color-mix(in srgb, var(--go) 12%, var(--panel)); color: var(--ink); }
.tag.dubious { background: color-mix(in srgb, var(--path) 35%, var(--panel)); color: var(--ink); }
.tag.mistake { background: color-mix(in srgb, var(--no) 25%, var(--panel)); color: var(--ink); }
/* ---------- coach alert banner ---------- */
.alert {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start;
  padding: 14px 16px; border-radius: 14px; border: 2px solid var(--no);
  background: color-mix(in srgb, var(--no) 13%, var(--panel)); color: var(--ink);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--no) 18%, transparent), var(--shadow);
  animation: alert-in .35s cubic-bezier(.2, 1.4, .4, 1);
}
.alert.soft {
  border-color: var(--capture); box-shadow: var(--shadow);
  background: color-mix(in srgb, var(--capture) 14%, var(--panel));
}
.alert.tip {
  border-color: var(--go);
  background: color-mix(in srgb, var(--go) 12%, var(--panel));
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--go) 18%, transparent), var(--shadow);
}
.alert-icon {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font: 800 1.5rem/1 var(--f-display); background: var(--no); color: #fff;
}
.alert.tip .alert-icon { background: var(--go); }
.alert.soft .alert-icon { background: var(--capture); color: var(--hollow); width: 32px; height: 32px; font-size: 1.15rem; }
.alert-main { min-width: 0; }
.alert-main p { margin: 0 0 6px; }
.alert-title { font: 800 clamp(1.15rem, 2.6vw, 1.4rem)/1.2 var(--f-display); letter-spacing: -0.01em; }
.alert.soft .alert-title { font-size: 1.05rem; }
.alert-cost { font-size: 1rem; }
.alert ul { margin: 0 0 12px; padding-left: 1.1em; }
.alert li { margin-bottom: 3px; }
.btn.subtle { background: transparent; border-color: color-mix(in srgb, var(--no) 50%, var(--line)); font-weight: 400; }
@keyframes alert-in { from { transform: translateY(-6px) scale(.98); opacity: .4; } }
.pit.warn-pit { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 5px var(--no), 0 0 22px var(--no); animation: pulse-red 1s ease-in-out infinite; }
.pit.better-pit { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 5px var(--go), 0 0 22px var(--go); animation: pulse-go 1s ease-in-out infinite; }
@keyframes pulse-red { 50% { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 8px var(--no), 0 0 30px var(--no); } }
@keyframes pulse-go { 50% { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 8px var(--go), 0 0 30px var(--go); } }
.pit.threat-pit { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 3px var(--no); }
.pit.threat-pit .cap { translate: -50% -130%; }
.pit.danger-pit { box-shadow: inset 0 6px 12px rgba(0, 0, 0, .55), 0 0 0 4px var(--no); }
.cap.go { background: var(--go); color: #fff; }
@media (max-width: 560px) { .alert { grid-template-columns: minmax(0, 1fr); gap: 8px; } .alert-icon { width: 32px; height: 32px; font-size: 1.2rem; } }
.warnbox { border-left: 4px solid var(--no); padding: 4px 0 4px 12px; margin-bottom: 10px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: .85rem; color: var(--muted); }
select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); max-width: 100%; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }

.table .card { margin-top: 4px; }
.log-list { margin: 10px 0 0; padding: 0; list-style: none; max-height: 240px; overflow-y: auto; font: 400 .92rem/1.45 var(--f-body); display: flex; flex-direction: column; gap: 2px; }
.log-list li { display: grid; grid-template-columns: 2.4em 1fr; gap: 6px; }
.log-list .n { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.log-list .who-1 { color: var(--muted); }
.log-list .empty { display: block; color: var(--muted); font-family: var(--f-body); }

.rules ul { margin: 10px 0 0; padding-left: 1.1em; }
.rules li { margin-bottom: 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* ---------- language ---------- */
.lang-select {
  font: 700 .9rem/1 var(--f-body); padding: 9px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
}
.welcome-langs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 18px; }
.lang-btn {
  border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  padding: 7px 14px; border-radius: 999px; font: 700 .92rem/1 var(--f-body);
}
.lang-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.lang-btn:focus-visible, .lang-select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- rules video (own tab) ---------- */
.video-view { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; max-width: 960px; width: 100%; margin: 0 auto; }
.video-view .video-title { margin: 8px 0 0; font: 800 clamp(1.6rem, 4vw, 2.4rem)/1.1 var(--f-display); letter-spacing: -0.02em; text-wrap: balance; }
.video-view .video-sub { margin: 0 0 4px; color: var(--muted); }
.video-view video { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; background: var(--ink); box-shadow: var(--shadow); }
.video-view .btn { margin-top: 6px; }

/* ---------- puzzles ---------- */
.puzzle { border-color: var(--capture); }
.pz-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.pz-badge { font: 700 .72rem/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; }
.pz-badge.daily { background: var(--capture); color: var(--hollow); }
.pz-badge.streak { background: color-mix(in srgb, var(--go) 22%, var(--panel)); color: var(--ink); }
.pz-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.stars { display: inline-flex; gap: 2px; font-size: 1.35rem; line-height: 1; margin-left: 4px; }
.stars i { font-style: normal; color: var(--line); }
.stars i.on { color: var(--capture); }
.stars.small { font-size: .8rem; }
.pz-all { margin-top: 12px; }
.pz-all > summary { cursor: pointer; font-weight: 700; }
.pz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin-top: 10px; }
.pz-tile {
  aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  font: 700 .95rem/1 var(--f-body); cursor: pointer; font-variant-numeric: tabular-nums; position: relative;
}
.pz-tile.solved { background: color-mix(in srgb, var(--go) 18%, var(--panel)); border-color: color-mix(in srgb, var(--go) 50%, var(--line)); }
.pz-tile.s3 { background: color-mix(in srgb, var(--capture) 40%, var(--panel)); border-color: var(--capture); }
.pz-tile.daily { box-shadow: 0 0 0 2px var(--capture); }
.pz-tile.current { outline: 3px solid var(--accent); outline-offset: 1px; }
.pz-tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.pz-score { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 8px 0; font-variant-numeric: tabular-nums; }
.pz-score-label { color: var(--muted); font-weight: 700; }
.pz-tip { margin-top: 6px; }

/* ---------- footer ---------- */
.foot { margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; text-align: center; }
.foot p { margin: 0; }

/* ---------- game switch and picker (Awale / Bao) ---------- */
.games-switch { display: inline-flex; padding: 3px; gap: 3px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.games-switch a { padding: 6px 12px; border-radius: 999px; font: 700 .9rem/1 var(--f-display); color: var(--muted); text-decoration: none; }
.games-switch a[aria-current="page"] { background: var(--ink); color: var(--panel); }
.games-switch a:hover:not([aria-current]) { color: var(--ink); }
.games-switch a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.game-pick { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(16px, 4vw, 34px); }
.tile.game { width: clamp(140px, 36vw, 200px); }
.tile.game .tile-meta { margin-top: 0; text-wrap: balance; }
.game-art {
  width: 100%; aspect-ratio: 1.45; border-radius: 22%; display: grid; gap: 7%; padding: 13% 10%;
  background: linear-gradient(180deg, var(--wood-hi), var(--wood) 45%, var(--wood-lo));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .18), inset 0 -4px 0 rgba(0, 0, 0, .25);
  transition: transform .15s ease, box-shadow .15s ease;
  --hole: radial-gradient(circle, var(--seed-a) 0 13%, transparent 14%), radial-gradient(circle at 50% 40%, var(--hollow) 0 60%, color-mix(in srgb, var(--hollow) 70%, var(--wood)) 70%, transparent 71%);
  background-origin: content-box;
}
.game-art.awale { grid-template: repeat(2, 1fr) / repeat(6, 1fr); padding: 20% 10%; }
.game-art.bao { grid-template: repeat(4, 1fr) / repeat(8, 1fr); gap: 5%; }
.game-art::before { content: none; }
.tile.game:hover .game-art, .tile.game:focus-visible .game-art { transform: translateY(-3px); box-shadow: 0 0 0 4px var(--panel), 0 0 0 7px var(--ink); }
.game-art i { align-self: center; justify-self: center; height: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--hole); box-shadow: inset 0 2px 4px rgba(0, 0, 0, .5); }

/* ---------- Bao rules switch ---------- */
.rules-mode { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.seg.small button { padding: 6px 12px; font-size: .88rem; }
#rules-learner[aria-pressed="true"] { background: var(--go); }
#rules-advanced[aria-disabled="true"] { opacity: .6; cursor: help; }
.flash-note { color: var(--ink); }

/* ---------- Bao board: 4 x 8 ---------- */
.board.bao-board { grid-template-columns: minmax(0, 1fr); gap: 8px; max-width: 760px; margin-inline: auto; width: 100%; }
.bao-rows {
  order: 1; min-width: 0;
  display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: auto auto 6px auto auto;
  gap: clamp(4px, 1vw, 10px) clamp(4px, 1vw, 10px);
}
.bao-mid {
  z-index: 0; margin: calc(-1 * clamp(3px, .7vw, 7px)) calc(-1 * clamp(4px, .8vw, 8px)); border-radius: 18px;
  background: linear-gradient(180deg, transparent calc(50% - 1px), rgba(0, 0, 0, .3) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)), rgba(255, 226, 170, .13);
  box-shadow: inset 0 0 0 1px rgba(255, 226, 170, .18);
}
.bao-board .store { flex-direction: row; justify-content: space-between; align-items: baseline; padding: 0 8px; }
.bao-board .store-count { font-size: 1.15rem; }
.bao-board .store-count::after { content: " \25CF"; color: var(--seed-a); font-size: .7em; }
.bpit .seed { width: 24%; }
.bpit { z-index: 1; }
.bpit.kichwa { border-radius: 38%; }
.bpit .count { font-size: .74rem; padding: 0 5px; min-width: 1.7em; }
.bpit[data-p="1"] .count { bottom: auto; top: -4px; }
.bpit.selected { z-index: 3; }
.bpit .arrow {
  position: absolute; z-index: 4; pointer-events: auto; cursor: pointer;
  width: clamp(28px, 5.4vw, 40px); height: clamp(28px, 5.4vw, 40px); border-radius: 50%;
  display: grid; place-items: center; font: 800 clamp(1rem, 2.6vw, 1.3rem)/1 var(--f-display);
  background: var(--panel); color: var(--ink); border: 3px solid var(--go); box-shadow: 0 3px 8px rgba(0, 0, 0, .4);
  translate: -50% -50%;
}
.bpit .arrow.on { background: var(--go); color: #fff; }
.bpit .arrow:hover { transform: scale(1.12); }
.bpit .arrow.a-right { left: 100%; top: 50%; }
.bpit .arrow.a-left { left: 0; top: 50%; }
.bpit .arrow.a-up { left: 50%; top: 0; }
.bpit .arrow.a-down { left: 50%; top: 100%; }
.bpit .rating { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; }
.bpit .cap { z-index: 3; }
.legend .sw-front { border-radius: 4px; background: color-mix(in srgb, var(--wood) 70%, #ffe2aa); }
@media (max-width: 620px) {
  .bao-board .store { padding: 0 4px; }
  .bpit .count { font-size: .58rem; padding: 0 3px; min-width: 1.5em; bottom: 1px; opacity: .92; }
  .bpit[data-p="1"] .count { top: 1px; bottom: auto; }
}
</style>

  const LESSON_TEXT = {
    en: {
      'bao:board': ['Your two rows', 'You are the bottom two rows. The row in the middle (your front row) faces your opponent. Pick a pit with 2 or more seeds, then choose left or right: the seeds go one by one round your own two rows.', 'Tap a pit with 2 or more seeds, then an arrow to choose the direction.', 'That is a move. Your seeds always stay on your two rows, going round in a circle.'],
      'bao:relay': ['Keep going', 'If your last seed lands on seeds, you pick them all up and keep sowing the same way. The turn only ends in an empty pit.', 'Find a move where the last seed lands on seeds, so you keep going.', 'See? One move, several sowings. In Bao, moves can be long!'],
      'bao:capture': ['Capturing', 'If your first sowing ends on seeds in your front row, and the opponent\'s pit facing it has seeds, you take them!', 'Find the move that captures. Look at your front row.', 'Captured! Those seeds are yours now.'],
      'bao:ends': ['From the end of the row', 'Captured seeds are sown again from one end of your front row, towards the middle. If you captured near an end, you start from that end.', 'Capture, and watch where the captured seeds start.', 'The captured seeds started at the end of your front row. In a longer move they could capture again!'],
      'bao:must': ['You must capture', 'If you can capture, you have to. Only capturing moves are allowed: the red pits can\'t be played right now.', 'Find a capturing move (a green pit).', 'Right: when a capture is possible, it is compulsory.'],
      'bao:back': ['Front row first', 'When you can\'t capture, start from your front row if it has a pit with 2 or more seeds. Only if it doesn\'t may you use your back row.', 'Your front row only has single seeds. Play from your back row.', 'Good. Keep seeds in your front row: if it is empty, you lose.'],
      'bao:win': ['Winning', 'You win when your opponent\'s front row is empty, or when they can\'t move. Seeds never leave the board.', 'Find the move that empties your opponent\'s front row.', 'Their front row is empty. You won!'],
      sowing: ['Moving seeds', 'Your pits are the bottom row. On your turn, pick one of your pits. You scoop up all its seeds and drop them one at a time into the next pits: to the right along your row, then along the top row going left.', 'Point at (or tap) one of your pits to see where the seeds will go. Then play it.', 'That is a whole turn. Every turn is just this: pick a pit, drop the seeds.'],

<script>
/*
 * Bao rules engine: "Bao la Kujifunza" (learners' Bao, also called mbili-mbili), the version
 * beginners play in Tanzania and Kenya before full Bao la Kiswahili. Pure functions, no DOM.
 *
 * Board: 4 rows x 8 pits. Each player owns two rows; the row facing the opponent is the
 * inner (front) row. Each player's 16 pits form a loop, indexed clockwise as seen from that
 * player's seat:
 *
 *   k = 0..7   inner row, from the player's left end (left kichwa, k=0) to the right end (k=7)
 *   k = 8..15  back row, from right to left
 *
 *   North (player 1) back row    k:  8  9 10 11 12 13 14 15     (screen left -> right)
 *   North inner row              k:  7  6  5  4  3  2  1  0
 *   South (player 0) inner row   k:  0  1  2  3  4  5  6  7
 *   South back row               k: 15 14 13 12 11 10  9  8
 *
 * Inner pit k faces the opponent's inner pit 7 - k.
 *
 * Rules (sources: Wikipedia "Bao (game)", Mancala World "Bao la Kujifunza"; see README):
 *  - 2 seeds in every pit, nothing in hand. Seeds never leave the board: captured seeds are
 *    sown into the capturer's own rows.
 *  - A turn starts from one of your pits with 2+ seeds, sown one by one clockwise or
 *    anticlockwise, staying in your own two rows.
 *  - Relay: if the last seed lands in an occupied pit, pick up all its seeds and keep sowing
 *    in the same direction. The turn ends when the last seed lands in an empty pit.
 *  - Capture: if the first sowing ends in an occupied pit of your inner row and the opponent's
 *    facing pit has seeds, the turn is a capturing turn (mtaji). Whenever a sowing in such a
 *    turn ends like that, you take the opponent's facing seeds and sow them from one end of
 *    your inner row (a kichwa), towards the middle: from the end nearest the capture if it was
 *    in one of the two end pits on either side, otherwise from the end that keeps your current
 *    direction (simplification: in full Bao the player may choose for the first capture).
 *  - You must make a capturing turn if you can. Otherwise (takata turn, no captures at all)
 *    you start from an inner-row pit with 2+ seeds if there is one, else from the back row.
 *  - A first sowing of 16 or more seeds is always a non-capturing turn.
 *  - You lose when your inner row is empty, or when you cannot move.
 */
(function (root) {
  'use strict';

  const N = 16;          // pits per player
  const INNER = 8;       // k < 8 is the inner row
  const MAX_SOWINGS = 300; // safety net against endless relays (never seen in play)

  function newGame(first) {
    return { pits: [new Array(N).fill(2), new Array(N).fill(2)], toMove: first || 0 };
  }

  function cloneState(s) {
    return { pits: [s.pits[0].slice(), s.pits[1].slice()], toMove: s.toMove };
  }

  const isInner = (k) => k < INNER;
  const facing = (k) => INNER - 1 - k;
  const sum = (a, from, to) => { let t = 0; for (let i = from; i < to; i++) t += a[i]; return t; };
  const innerSum = (s, p) => sum(s.pits[p], 0, INNER);
  const sideSum = (s, p) => sum(s.pits[p], 0, N);

  /** Screen position of pit k of player p: row 0 (top) .. 3 (bottom), col 0..7 (left to right). */
  function screenPos(p, k) {
    if (p === 0) return k < INNER ? { row: 2, col: k } : { row: 3, col: 15 - k };
    return k < INNER ? { row: 1, col: 7 - k } : { row: 0, col: k - 8 };
  }

  /** Would sowing pit k in direction dir be a capturing turn? (first sowing only) */
  function isCaptureMove(s, k, dir) {
    const P = s.pits[s.toMove], O = s.pits[1 - s.toMove];
    const n = P[k];
    if (n < 2 || n > 15) return false;
    const end = ((k + dir * n) % N + N) % N;
    return isInner(end) && P[end] >= 1 && O[facing(end)] > 0;
  }

  /**
   * Legal moves for the side to move: [{ pit, dir, capture }].
   * Captures are compulsory; non-capturing moves start in the inner row when possible.
   */
  function legalMoves(s) {
    const P = s.pits[s.toMove];
    const caps = [];
    for (let k = 0; k < N; k++) {
      if (P[k] < 2) continue;
      for (const dir of [1, -1]) if (isCaptureMove(s, k, dir)) caps.push({ pit: k, dir, capture: true });
    }
    if (caps.length) return caps;
    const out = [];
    const innerOk = P.slice(0, INNER).some((n) => n >= 2);
    for (let k = 0; k < N; k++) {
      if (P[k] < 2) continue;
      if (innerOk && !isInner(k)) continue;
      out.push({ pit: k, dir: 1, capture: false }, { pit: k, dir: -1, capture: false });
    }
    return out;
  }

  /** Why can't pit k be played? 'ok' | 'not-your-side' | 'too-few' | 'must-capture' | 'inner-first' */
  function pitStatus(s, p, k) {
    if (p !== s.toMove) return 'not-your-side';
    const moves = legalMoves(s);
    if (moves.some((m) => m.pit === k)) return 'ok';
    const P = s.pits[p];
    if (P[k] < 2) return 'too-few';
    if (moves.length && moves[0].capture) return 'must-capture';
    return 'inner-first';
  }

  /**
   * Play a move. Returns { state, events, captured, sowings, mtaji }.
   * events (for animation and explanations):
   *   { t: 'pick', k, n }            lift n seeds from own pit k
   *   { t: 'drop', k }               one seed into own pit k
   *   { t: 'capture', k, from, n, kichwa, dir }  take n seeds from the opponent's pit `from`
   *                                  (facing own pit k) and start sowing them at own `kichwa`
   *   { t: 'end', k, reason }        'empty' (last seed in an empty pit) | 'limit'
   */
  function play(s, move) {
    const st = cloneState(s);
    const me = st.toMove;
    const P = st.pits[me], O = st.pits[1 - me];
    const events = [];
    let k = move.pit, dir = move.dir;
    let n = P[k];
    if (n < 2) throw new Error('Pit has fewer than 2 seeds');
    P[k] = 0;
    events.push({ t: 'pick', k, n });
    let mtaji = null;
    let captured = 0, captures = 0, sowings = 0;
    for (;;) {
      let pos = k;
      for (let i = 0; i < n; i++) {
        pos = ((pos + dir) % N + N) % N;
        P[pos]++;
        events.push({ t: 'drop', k: pos });
      }
      sowings++;
      const marker = isInner(pos) && P[pos] > 1 && O[facing(pos)] > 0;
      if (mtaji === null) mtaji = n <= 15 && marker; // decided by the first sowing
      if (P[pos] === 1) { events.push({ t: 'end', k: pos, reason: 'empty' }); break; }

 * Bao coach and computer opponent. Same ideas as the Awale advisor:
 *  - looksAt / checkTrap: one move ahead, for beginners ("you win N, then the opponent can take M").
 *  - search: alpha-beta on seeds-on-my-side, for the computer player.

  /** Result of a move from the mover's point of view, including "the game is over". */
  function outcome(s, m) {
    const r = B.play(s, m);
    const end = B.checkEnd(r.state);
    return { r, end };
  }

   * For each legal move: seeds captured now (take), the most the opponent can capture right after
   * (risk; a reply that wins the game counts as everything), net = take - risk.

  function looksAt(s) {

      const { r, end } = outcome(s, m);
      let take = r.captured, risk = 0, riskMove = null, riskEvents = null;
      if (end && end.winner === me) take = 64;
      else if (!end) {
        for (const om of B.legalMoves(r.state)) {
          const o = outcome(r.state, om);
          const lost = o.end && o.end.winner !== me ? 64 : o.r.captured;
          if (lost > risk) { risk = lost; riskMove = om; riskEvents = o.r.events; }

    return looks.slice().sort((a, b) => b.net - a.net || b.take - a.take || a.risk - b.risk)[0];

  function checkTrap(s, move) {
    const looks = looksAt(s);

    if (!mine || looks.length < 2) return null;
    const better = simpleBest(looks);
    if (better.key === mine.key || better.net - mine.net < 3) return null;
    const kind = mine.risk - better.risk >= 3 ? 'danger' : 'missed';

    // Seeds on my side, with a small bonus for a healthy inner row (an empty inner row loses).
    const mine = B.sideSum(s, me), theirs = 64 - mine;

    medium: { depth: 2, temperature: 1.2, blunder: 0.1, timeMs: 400, adaptive: true },
    hard: { depth: 5, temperature: 0, blunder: 0, timeMs: 1200, adaptive: false },

  // ---------- board DOM ----------
  const pitEls = [[], []];
  const AT = {}; // "row,col" -> { p, k }
  for (const p of [0, 1]) for (let k = 0; k < B.N; k++) { const sp = B.screenPos(p, k); AT[sp.row + ',' + sp.col] = { p, k }; }

  function buildBoard() {
    const rows = $('bao-rows');
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 8; col++) {
        const { p, k } = AT[row + ',' + col];
        const b = document.createElement('button');
        b.className = 'pit bpit' + (B.isInner(k) ? ' front' : '') + (B.isInner(k) && (k === 0 || k === 7) ? ' kichwa' : '');
        b.dataset.p = p; b.dataset.k = k;
        b.style.gridRow = String(row + 1 + (row >= 2 ? 1 : 0));
        b.style.gridColumn = String(col + 1);
        b.innerHTML = '<div class="seeds"></div><span class="count">0</span>';
        b.addEventListener('mouseenter', () => { G.hoverPit = { p, k }; renderCoach(); });
        b.addEventListener('mouseleave', () => { G.hoverPit = null; renderCoach(); });
        b.addEventListener('click', () => onPitClick(p, k));
        pitEls[p][k] = b;
        rows.appendChild(b);
      }
    }
    const mid = document.createElement('div');
    mid.className = 'bao-mid';
    mid.style.gridRow = '2 / 5';
    mid.style.gridColumn = '1 / -1';
    rows.appendChild(mid);
  }

  const SEED_POS = [];
  for (let k = 0; k < 30; k++) {
    const r = k === 0 ? 0 : 0.17 * Math.sqrt(k) * 1.45;
    const a = k * 2.39996;
    SEED_POS.push([50 + Math.min(r, 0.47) * 100 * Math.cos(a), 50 + Math.min(r, 0.47) * 100 * Math.sin(a)]);
  }
  function seedHtml(n) {
    let h = '';
    for (let k = 0; k < Math.min(n, 20); k++) {
      const [x, y] = SEED_POS[k];
      h += '<i class="seed" style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%"></i>';
    }
    return h;
  }

  // Screen direction of the first step of a move, for arrows and words.
  function arrowFor(p, k, dir) {
    const a = B.screenPos(p, k), b = B.screenPos(p, ((k + dir) % B.N + B.N) % B.N);
    if (b.col > a.col) return 'right';
    if (b.col < a.col) return 'left';
    return b.row < a.row ? 'up' : 'down';
  }
  const ARROWS = { right: '→', left: '←', up: '↑', down: '↓' };
  let arrowSig = '';

  // ---------- rendering ----------
  function isHumanTurn() {
    if (!G.state || G.result || G.busy) return false;
    if (G.mode === 'cpu') return G.state.toMove === 0;
    if (G.mode === 'learn') return G.state.toMove === 0 && !G.lessonOutcome;
    if (G.mode === 'puzzle') return G.state.toMove === 0 && !PZ.outcome;
    return true;
  }
  function legal() { return G.state ? B.legalMoves(G.state) : []; }

  function previewResult() {
    if (G.selected == null || G.dir == null || !isHumanTurn()) return null;
    return B.play(G.state, { pit: G.selected, dir: G.dir });
  }

  function render() {
    const s = G.state;
    const pits = G.display || s.pits;
    const human = isHumanTurn();
    const moves = human ? legal() : [];
    const legalPits = new Set(moves.map((m) => m.pit));
    const mover = s.toMove;
    const colors = settings.ratings && human && !G.pending && !isPractice() ? A.moveColors(s) : null;
    const pre = previewResult();
    const prePath = new Set(), preCap = {};
    if (pre && G.mode !== 'puzzle') {
      for (const e of pre.events) {
        if (e.t === 'drop') prePath.add(e.k);
        if (e.t === 'capture') preCap[e.from] = (preCap[e.from] || 0) + e.n;
      }
    } else if (pre) {
      for (const e of pre.events) { if (e.t === 'drop') prePath.add(e.k); if (e.t !== 'drop' && e.t !== 'pick') break; }
    }
    const firstEnd = pre ? pre.events.find((e) => e.t === 'pick' && pre.events.indexOf(e) > 0 || e.t === 'capture' || e.t === 'end') : null;

    for (const p of [0, 1]) {
      for (let k = 0; k < B.N; k++) {
        const el = pitEls[p][k];
        const n = pits[p][k];
        if (el.dataset.n !== String(n)) { el.querySelector('.seeds').innerHTML = seedHtml(n); el.dataset.n = n; }
        el.querySelector('.count').textContent = n;
        const mine = p === mover && human;
        el.className = 'pit bpit' + (B.isInner(k) ? ' front' : '') + (B.isInner(k) && (k === 0 || k === 7) ? ' kichwa' : '');
        if (mine && (legalPits.has(k) || n > 0)) el.classList.add(legalPits.has(k) ? 'legal' : 'illegal', 'mine');
        if (G.selected === k && p === mover && human) el.classList.add('selected');
        for (const x of el.querySelectorAll('.cap, .rating')) x.remove();
        if (colors && p === mover && colors[k]) {
          const r = document.createElement('span'); r.className = 'rating ' + colors[k]; el.appendChild(r);
        }
        if (pre && p === mover && prePath.has(k)) el.classList.add('path');
        if (pre && p !== mover && preCap[k]) { el.classList.add('capture'); addBadge(el, '+' + preCap[k], 'cap'); }
        el.setAttribute('aria-label', t('aria.pit', { p: '', n: seedsWord(n) }).replace(/\s+,/, ','));
      }
    }
    if (pre && firstEnd && firstEnd.k != null && firstEnd.t === 'end') pitEls[mover][firstEnd.k].classList.add('last');

    // Direction arrows on the selected pit. Kept in place while hovering, so a click is never lost.
    const sig = G.selected != null && human ? mover + ':' + G.selected + ':' + moves.filter((x) => x.pit === G.selected).map((m) => m.dir).join(',') : '';
    if (sig !== arrowSig) {
      for (const x of document.querySelectorAll('.bpit .arrow')) x.remove();
      arrowSig = sig;
      if (sig) {
        const el = pitEls[mover][G.selected];
        const pit = G.selected;
        for (const m of moves.filter((x) => x.pit === pit)) {
          const dirName = arrowFor(mover, pit, m.dir);
          const a = document.createElement('span');
          a.className = 'arrow a-' + dirName;
          a.dataset.dir = m.dir;
          a.textContent = ARROWS[dirName];
          a.setAttribute('role', 'button');
          a.setAttribute('aria-label', t('bao.dir.' + dirName));
          a.addEventListener('mouseenter', () => { if (G.dir !== m.dir) { G.dir = m.dir; render(); } });
          a.addEventListener('click', (ev) => { ev.stopPropagation(); if (isHumanTurn() && !G.pending) play({ pit, dir: m.dir }, false); });
          el.appendChild(a);
        }
      }
    }
    for (const a of document.querySelectorAll('.bpit .arrow')) a.classList.toggle('on', +a.dataset.dir === G.dir);
    // Hint / warning marks.
    if (G.hint && human) {
      pitEls[mover][G.hint.pit].classList.add('hint');
    }
    if (G.pending) {
      const tr = G.pending.trap;
      pitEls[mover][G.pending.move.pit].classList.add('warn-pit');
      pitEls[mover][tr.better.pit].classList.add('better-pit');
      addBadge(pitEls[mover][tr.better.pit], ARROWS[arrowFor(mover, tr.better.pit, tr.better.dir)] + ' ' + t('badge.try'), 'cap go');
      addBadge(pitEls[mover][G.pending.move.pit], t('badge.yourPick'), 'cap no');
    }
    if (G.anim) {
      const a = G.anim;
      if (a.src != null) pitEls[a.p][a.src].classList.add('source');
      if (a.cur != null) pitEls[a.p][a.cur].classList.add('active');
      if (a.flash != null) pitEls[1 - a.p][a.flash].classList.add('flash', 'capture');
      for (const k of a.visited) pitEls[a.p][k].classList.add('path');
    }

    for (const p of [0, 1]) {
      const el = $('store-' + p);
      el.querySelector('.store-count').textContent = pits[p].reduce((x, y) => x + y, 0);
      $('label-' + p).textContent = sideName(p);
    }
    renderStatus(); renderCoach(); renderActions(); renderEnd(); renderAlert();
  }

  function addBadge(el, text, cls) {
    const b = document.createElement('span'); b.className = cls; b.textContent = text; el.appendChild(b);
  }

  function renderStatus() {
    const s = G.state, el = $('status');
    if (G.mode === 'learn' && G.lessonOutcome) {
      const ok = G.lessonOutcome.ok, last = G.lesson === LESSONS.length - 1;
      el.innerHTML = '<span class="chip ' + (ok ? 'done' : 'retry') + '">' + (ok ? '✓' : '↺') + '</span><span>' +
        t(ok ? 'status.lessonOk' : 'status.lessonRetry') + '</span>' +
        '<button class="btn ' + (ok ? '' : 'primary') + ' status-btn" id="status-retry">↺ ' + t('lesson.again') + '</button>' +
        '<button class="btn ' + (ok ? 'primary' : '') + ' status-btn" id="status-next">' + t(last ? 'lesson.last' : 'lesson.next') + ' →</button>';
      $('status-next').onclick = () => $('lesson-next').click();
      $('status-retry').onclick = () => loadLesson(G.lesson);
      return;
    }
    if (G.mode === 'puzzle' && PZ.outcome) {
      const o = PZ.outcome;
      el.innerHTML = (o.ok ? '<span class="chip done">✓</span><span>' + t('puzzle.solved') + '</span>' + (o.shown ? '' : starsHtml(o.stars))
        : '<span class="chip retry">↺</span><span>' + t('status.lessonRetry') + '</span>') +
        '<button class="btn ' + (o.ok ? '' : 'primary') + ' status-btn" id="pz-retry">↺ ' + t('lesson.again') + '</button>' +
        (o.ok ? '' : '<button class="btn status-btn" id="pz-show">' + t('puzzle.show') + '</button>') +
        '<button class="btn ' + (o.ok ? 'primary' : '') + ' status-btn" id="pz-next">' + t('puzzle.next') + ' →</button>';
      $('pz-retry').onclick = () => loadPuzzle(PZ.index, !o.ok);
      $('pz-next').onclick = () => loadPuzzle(nextPuzzleIndex());
      if ($('pz-show')) $('pz-show').onclick = showAnswer;
      return;
    }
    if (G.result) { el.innerHTML = '<span>' + t('status.over') + '</span>'; return; }
    const p = s.toMove;
    const chip = '<span class="chip name' + (p === 1 ? ' north' : '') + '">' + sideName(p) + '</span>';
    if (G.mode === 'cpu' && p === 1) { el.innerHTML = chip + '<span class="thinking">' + t('status.thinking') + '</span>'; return; }
    if (G.busy) { el.innerHTML = chip + '<span>' + t('status.sowing') + '</span>'; return; }
    el.innerHTML = chip + '<span>' + (G.mode === 'duo' ? t('status.duoTurn') : t('status.yourTurn')) + '</span>';
  }

  /** Plain-language description of a move from its events. */
  function describe(r, move, p) {
    const out = [];
    const first = r.events[0];
    out.push(t('bao.d.first', { n: seedsWord(first.n), dir: t('bao.dir.' + arrowFor(p, move.pit, move.dir)) }));
    if (first.n >= 16) out.push(t('bao.d.big'));
    const relays = r.events.filter((e, i) => e.t === 'pick' && i > 0).length;
    if (relays === 1) out.push(t('bao.d.relay1'));
    else if (relays > 1) out.push(t('bao.d.relayN', { k: relays }));
    if (r.captures === 1) out.push(t('bao.d.capture1', { n: seedsWord(r.captured) }));
    else if (r.captures > 1) out.push(t('bao.d.captureN', { n: seedsWord(r.captured), k: r.captures }));
    else out.push(t('bao.d.noCapture'));
    const end = B.checkEnd(r.state);
    if (end && end.winner === p) out.push(t('bao.d.wins'));
    return out;
  }

  const REASON = { 'not-your-side': 'bao.r.notYours', 'too-few': 'bao.r.tooFew', 'must-capture': 'bao.r.mustCapture', 'inner-first': 'bao.r.innerFirst' };

  function renderCoach() {
    const body = $('coach-body');
    const s = G.state;
    if (!s) return;
    if (G.pending) { body.innerHTML = ''; return; }
    if (G.result) { body.innerHTML = '<p>' + endSummary() + '</p>'; return; }
    const human = isHumanTurn();
    if (human && G.selected != null && G.dir != null) {
      const r = previewResult();
      let lines = describe(r, { pit: G.selected, dir: G.dir }, s.toMove);
      if (G.mode === 'puzzle') lines = lines.slice(0, 1);
      let tag = '';
      if (G.mode !== 'puzzle' && !(G.mode === 'learn' && G.lesson < 2)) {
        const look = A.looksAt(s).find((l) => l.pit === G.selected && l.dir === G.dir);
        if (look && look.risk >= 3) tag = '<p><span class="tag mistake">' + t('tag.careful') + '</span> ' +
          (look.risk >= 64 ? t('bao.t.dangerLose', { opp: oppWords(s.toMove) }) : t('preview.careful', { opp: oppWords(s.toMove), n: seedsWord(look.risk) })) + '</p>';
        else if (look) tag = '<p><span class="tag best">' + t('tag.safe') + '</span> ' + t('preview.safe', { opp: oppWords(s.toMove) }) + '</p>';
      }
      body.innerHTML = lines.map((l, k) => '<p' + (k === 0 ? ' class="lead"' : '') + '>' + l + '</p>').join('') + tag;
      return;
    }
    if (human && G.hoverPit && G.selected == null) {
      const st = G.hoverPit.p === s.toMove ? B.pitStatus(s, s.toMove, G.hoverPit.k) : 'not-your-side';
      if (st !== 'ok') { body.innerHTML = '<p class="lead">' + t('notAllowed') + '</p><p>' + t(REASON[st]) + '</p>'; return; }
    }
    if (G.coachNote) { body.innerHTML = typeof G.coachNote === 'function' ? G.coachNote() : G.coachNote; return; }
    if (human) {
      const ms = legal();
      body.innerHTML = '<p>' + (G.selected != null ? t('bao.pickDir') : t('bao.idle')) + '</p>' +
        (ms.length && ms[0].capture && G.selected == null ? '<p>' + t('bao.idleMust') + '</p>' : '');
    } else if (G.mode === 'cpu') body.innerHTML = '<p>' + t('cpu.choosing') + '</p>';
    else body.innerHTML = '';
  }

  function renderActions() {
    $('btn-undo').disabled = G.busy || G.undo.length === 0 || isPractice();
    $('btn-hint').disabled = !isHumanTurn();
    $('btn-undo').hidden = isPractice();
    $('btn-new').hidden = isPractice();
    $('btn-split').hidden = true;
  }

  function endSummary() {
    const r = G.result;
    if (!r) return '';
    const loser = sideName(1 - r.winner);
    return r.reason === 'inner-empty' ? t('bao.end.inner', { name: loser }) : t('bao.end.noMoves', { name: loser });
  }

  function renderEnd() {
    const r = G.result, card = $('endcard');
    if (!r || isPractice()) { card.hidden = true; return; }
    card.hidden = false;
    $('end-title').textContent = G.mode === 'cpu' ? (r.winner === 0 ? t('end.youWin') : t('end.cpuWins')) : t('end.wins', { name: playerName(r.winner) });
    $('end-reason').textContent = endSummary();
    const s = G.state;
    $('end-score').textContent = sideName(0) + ' ' + B.sideSum(s, 0) + ' – ' + B.sideSum(s, 1) + ' ' + sideName(1);
  }

  // ---------- warnings ----------
  let alertShownFor = null;
  function renderAlert() {
    const el = $('alert');
    if (G.pending) {
      const tr = G.pending.trap;
      const opp = oppWords(G.state.toMove);
      const lines = [];
      let title;
      if (tr.kind === 'danger') {
        title = t('trap.dangerTitle');
        lines.push(tr.mine.risk >= 64 ? t('bao.t.dangerLose', { opp }) : t('bao.t.danger', { opp, n: tr.mine.risk }));
      } else {
        title = t('trap.missedTitle');
        lines.push(tr.better.take >= 64 ? t('bao.t.missedWin') : t('bao.t.missed', { n: tr.better.take }));
      }
      lines.push(tr.better.take && tr.better.take < 64 ? t('bao.t.tryWin', { n: seedsWord(tr.better.take) }) : t('bao.t.trySafe'));
      el.className = 'alert ' + (tr.kind === 'missed' ? 'tip' : 'stop');
      el.innerHTML = '<div class="alert-icon" aria-hidden="true">' + (tr.kind === 'missed' ? '+' : '!') + '</div><div class="alert-main">' +
        '<p class="alert-title">' + title + '</p>' + lines.map((l) => '<p class="alert-cost">' + l + '</p>').join('') +
        '<div class="btnrow"><button class="btn primary" id="a-best">' + t('bao.a.instead') + '</button>' +
        '<button class="btn" id="a-back">' + t('alert.again') + '</button>' +
        '<button class="btn subtle" id="a-anyway">' + t('bao.a.anyway') + '</button></div></div>';
      el.hidden = false;
      $('a-best').onclick = () => { const b = tr.better; G.pending = null; play({ pit: b.pit, dir: b.dir }, true); };
      $('a-back').onclick = () => { G.pending = null; G.selected = null; G.dir = null; render(); };
      $('a-anyway').onclick = () => { const m = G.pending.move; G.pending = null; play(m, true); };
      if (alertShownFor !== G.pending) {
        alertShownFor = G.pending;
        const r = el.getBoundingClientRect();
        if (r.top < 0 || r.bottom > window.innerHeight) el.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
      }
      return;
    }
    alertShownFor = null;
    if (G.afterNote && !G.result) {
      el.className = 'alert soft';
      el.innerHTML = '<div class="alert-icon" aria-hidden="true">?</div><div class="alert-main">' + G.afterNote() + '</div>';
      el.hidden = false;
      return;
    }
    el.hidden = true; el.innerHTML = '';
  }

  // ---------- interaction ----------
  function onPitClick(p, k) {
    if (!isHumanTurn() || G.pending) return;
    const s = G.state;
    if (p !== s.toMove) return shake(p, k);
    const dirs = legal().filter((m) => m.pit === k);
    if (!dirs.length) { G.selected = null; G.dir = null; G.hoverPit = { p, k }; render(); return shake(p, k); }
    if (G.selected === k) { G.selected = null; G.dir = null; G.hint = null; render(); return; }
    G.selected = k;
    G.dir = (G.hint && G.hint.pit === k) ? G.hint.dir : dirs[0].dir;
    render();
  }
  function shake(p, k) {
    const el = pitEls[p][k];
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }

  function play(move, confirmed) {
    const trap = !isPractice() ? A.checkTrap(G.state, move) : null;
    if (!confirmed && settings.coach && trap) {
      G.warnedThisTurn = trap.kind;
      G.pending = { move, trap };
      render();
      return;
    }
    commitMove(move, trap);
  }

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  async function animate(before, r, my) {
    const speed = reduceMotion ? 0 : parseInt(settings.speed, 10);
    if (speed === 0) return;
    const me = before.toMove;
    const drops = r.events.filter((e) => e.t === 'drop').length;
    const step = Math.max(35, Math.min(speed, 7000 / Math.max(1, drops))); // long moves play faster
    G.display = [before.pits[0].slice(), before.pits[1].slice()];
    G.anim = { p: me, src: null, cur: null, flash: null, visited: [] };
    for (const e of r.events) {
      if (my !== token) return;
      if (e.t === 'pick') { G.display[me][e.k] = 0; G.anim.src = e.k; G.anim.visited = []; G.anim.cur = null; render(); await sleep(step * 1.5); }
      else if (e.t === 'drop') {
        G.display[me][e.k]++;
        if (G.anim.cur != null) G.anim.visited.push(G.anim.cur);
        G.anim.cur = e.k; render(); await sleep(step);
      } else if (e.t === 'capture') {
        G.anim.flash = e.from; render(); await sleep(Math.max(500, step * 3));
        G.display[1 - me][e.from] = 0; G.anim.flash = null; G.anim.src = e.kichwa; G.anim.visited = []; G.anim.cur = null;
        render(); await sleep(step * 2);
      }
    }
    await sleep(step);
  }

  async function commitMove(move, trap) {
    const my = token;
    const s = G.state;
    if (!isPractice()) G.undo.push({ state: B.cloneState(s), log: G.log.slice(), turns: G.rec ? G.rec.turns.length : 0 });
    G.selected = null; G.dir = null; G.pending = null; G.coachNote = null; G.hint = null;
    if (G.mode === 'duo' || s.toMove === 0) G.afterNote = null;
    const r = B.play(s, move);
    G.busy = true;
    await animate(s, r, my);
    if (my !== token) return;
    G.busy = false; G.display = null; G.anim = null;
    G.state = r.state;
    G.result = isPractice() ? null : B.checkEnd(r.state);
    G.log.push({ player: s.toMove, text: () => logText(s.toMove, r, trap, move) });
    recordTurn(s.toMove, move, r, trap);
    renderLog();
    if (G.mode === 'learn') { checkLesson(r); render(); return; }
    if (G.mode === 'puzzle') { await checkPuzzle(move, s, r, my); return; }
    if (settings.coach && trap && trap.mine.key === A.moveKey(move)) {
      G.afterNote = () => '<p class="alert-title">' + cap(trap.kind === 'danger'
        ? (trap.mine.risk >= 64 ? t('bao.t.dangerLose', { opp: oppWords(s.toMove) }) : t('bao.after.danger', { opp: oppWords(s.toMove), n: trap.mine.risk }))
        : t('after.missed', { n: seedsWord(trap.better.take) })) + '</p><p class="alert-cost">' + t('after.undo') + '</p>';
    }
    if (G.mode === 'cpu' && s.toMove === 1 && !G.result) {
      const canWin = legal().some((m) => m.capture);
      G.coachNote = () => '<p>' + (r.captured ? t('bao.cpu.took', { n: r.captured }) : t('bao.cpu.played')) + ' ' + t('cpu.yourTurn') + '</p>' +
        (canWin ? '<p>' + t('cpu.canWin') + '</p>' : '');
    }
    render();
    if (G.mode === 'cpu' && !G.result && G.state.toMove === 1) computerTurn();
  }

  function logText(p, r, trap, move) {
    let txt = sideName(p) + ': ' + ARROWS[arrowFor(p, move.pit, move.dir)];
    if (r.captured) txt += t('log.won', { n: seedsWord(r.captured) });
    if (trap && trap.mine.key === A.moveKey(move)) txt += trap.kind === 'danger' ? t('log.risky') : t('log.missed');
    return txt;
  }

  async function computerTurn() {
    const my = token;
    render();
    const started = Date.now();
    await sleep(30);
    const m = A.chooseMove(G.state, settings.level, { adaptive: settings.adaptive });
    await sleep(reduceMotion ? 0 : Math.max(0, 600 - (Date.now() - started)));
    if (my !== token || G.mode !== 'cpu') return;
    commitMove({ pit: m.pit, dir: m.dir }, null);
  }

  function hint() {
    if (!isHumanTurn()) return;
    if (G.mode === 'puzzle') { puzzleHint(); return; }
    const b = A.simpleBest(A.looksAt(G.state));

  // ---------- puzzles (premium) ----------
  function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dailyIndex() { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) % Math.max(1, PUZZLES.length); }
  function progress() { const all = loadJSON('bao.puzzles', {}); const pr = all[focusPlayer()] || {}; return { stars: pr.stars || {}, daily: pr.daily || {} }; }
  function saveProgress(pr) { const all = loadJSON('bao.puzzles', {}); all[focusPlayer()] = pr; saveJSON('bao.puzzles', all); }
  function streak(pr) { const d = new Date(); if (!pr.daily[dayKey(d)]) d.setDate(d.getDate() - 1); let n = 0; while (pr.daily[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
  function startPuzzleIndex() { const pr = progress(); if (!pr.daily[dayKey(new Date())]) return dailyIndex(); const i = PUZZLES.findIndex((p) => !pr.stars[p.id]); return i >= 0 ? i : dailyIndex(); }
  function nextPuzzleIndex() { const pr = progress(); for (let k = 1; k <= PUZZLES.length; k++) { const i = (PZ.index + k) % PUZZLES.length; if (!pr.stars[PUZZLES[i].id]) return i; } return (PZ.index + 1) % PUZZLES.length; }
  function starsHtml(n) { let h = '<span class="stars">'; for (let k = 1; k <= 3; k++) h += '<i class="' + (k <= n ? 'on' : '') + '">★</i>'; return h + '</span>'; }
  function loadPuzzle(i, keep) {
    token++;
    PZ.index = (i + PUZZLES.length) % PUZZLES.length;
    PZ.outcome = null;
    if (!keep) { PZ.tries = 0; PZ.hints = 0; PZ.shown = false; }
    const pz = PUZZLES[PZ.index];
    G.state = { pits: [pz.pits[0].slice(), pz.pits[1].slice()], toMove: 0 };
    G.undo = []; G.log = []; G.result = null;
    resetTransient(); renderPuzzleCard(); renderLog(); render();
  }
  function renderPuzzleCard() {
    if (!PUZZLES.length) return;
    const pz = PUZZLES[PZ.index], pr = progress(), st = streak(pr), isDaily = PZ.index === dailyIndex();
    $('pz-step').textContent = t('puzzle.count', { n: PZ.index + 1, total: PUZZLES.length });
    $('pz-daily').hidden = !isDaily; $('pz-daily').textContent = t('puzzle.daily');
    $('pz-streak').hidden = st === 0; $('pz-streak').textContent = t(st === 1 ? 'puzzle.streak1' : 'puzzle.streak', { n: st });
    $('pz-title').textContent = t('puzzle.type.' + pz.type);
    $('pz-task').textContent = t('baopz.task.' + pz.type);
    $('pz-best').innerHTML = pr.stars[pz.id] ? starsHtml(pr.stars[pz.id]) : '';
    $('pz-progress').textContent = t('puzzle.solvedCount', { n: PUZZLES.filter((p) => pr.stars[p.id]).length, total: PUZZLES.length });
    $('pz-today').hidden = isDaily; $('pz-today').textContent = t('puzzle.daily');
    $('pz-grid').innerHTML = PUZZLES.map((p, i) => '<button class="pz-tile' + (i === PZ.index ? ' current' : '') + (i === dailyIndex() ? ' daily' : '') +
      (pr.stars[p.id] ? ' solved s' + pr.stars[p.id] : '') + '" data-i="' + i + '">' + (i + 1) + '</button>').join('');
    for (const b of $('pz-grid').querySelectorAll('button')) b.onclick = () => loadPuzzle(+b.dataset.i);
  }
  async function checkPuzzle(move, before, r, my) {
    const pz = PUZZLES[PZ.index];
    const ok = move.pit === pz.answer.pit && move.dir === pz.answer.dir;
    PZ.tries++;
    const looks = A.looksAt(before);
    const ans = looks.find((l) => l.pit === pz.answer.pit && l.dir === pz.answer.dir);
    const mine = looks.find((l) => l.pit === move.pit && l.dir === move.dir);
    if (ok) {
      const stars = PZ.shown ? 0 : PZ.tries === 1 && PZ.hints === 0 ? 3 : PZ.tries <= 2 && PZ.hints <= 1 ? 2 : 1;
      PZ.outcome = { ok: true, stars, shown: PZ.shown };
      if (!PZ.shown) { const pr = progress(); pr.stars[pz.id] = Math.max(pr.stars[pz.id] || 0, stars); if (PZ.index === dailyIndex()) pr.daily[dayKey(new Date())] = true; saveProgress(pr); }
      G.coachNote = () => '<p class="lead">' + (ans.take >= 64 ? t('bao.d.wins') : ans.take ? t('hint.winSafe', { n: seedsWord(ans.take) }) : t('hint.safe')) + '</p>';
      renderPuzzleCard(); render(); return;
    }
    PZ.outcome = { ok: false };
    const score = (label, l) => '<span class="pz-score-label">' + label + '</span><span>' + t('pz.fb.winLose', { a: Math.min(l.take, 64), b: Math.min(l.risk, 64) }) + '</span>';
    G.coachNote = () => '<p class="lead">' + (mine.risk >= 64 ? t('bao.t.dangerLose', { opp: t('opp.other') })
      : mine.risk >= 3 ? t('bao.t.danger', { opp: t('opp.other'), n: mine.risk }) : t('pz.fb.bestSafe')) + '</p>' +
      '<p>' + (ans.take ? t('pz.fb.best', { n: seedsWord(Math.min(ans.take, 64)) }) : t('pz.fb.bestSafe')) + '</p>' +
      '<div class="pz-score">' + score(t('pz.fb.yours'), mine) + score(t('pz.fb.bestLabel'), ans) + '</div>' +
      '<p class="pz-tip"><span class="tag best">' + t('pz.fb.tipLabel') + '</span> ' + t('baopz.tip.' + pz.type) + '</p>';
    render();
    if (mine.risk >= 3 && mine.riskMove && !B.checkEnd(G.state)) {
      await sleep(reduceMotion ? 0 : 700);
      if (my !== token) return;
      const prev = G.state;
      const rr = B.play(prev, mine.riskMove);
      G.busy = true;
      await animate(prev, rr, my);
      if (my !== token) return;

  }
  function puzzleHint() {

  function showAnswer() {

  // ---------- games ----------
  function resetTransient() {
    G.busy = false; G.display = null; G.anim = null; G.pending = null; G.selected = null; G.dir = null;
    G.coachNote = null; G.afterNote = null; G.hint = null; G.hoverPit = null;

  function newGame() {

  function undo() {

  function renderLog() {

    el.innerHTML = G.log.map((m, k) => '<li class="who-' + m.player + '"><span class="n">' + (k + 1) + '.</span><span>' + m.text() + '</span></li>').join('');
    el.scrollTop = el.scrollHeight;

  function startRecording(first) {
    G.warnedThisTurn = null;

    G.rec = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), game: GAME, date: new Date().toISOString(), mode: G.mode,
      level: G.mode === 'cpu' ? settings.level : null, players: [playerName(0), playerName(1)], computer: G.mode === 'cpu' ? 1 : null,

  function recordTurn(p, move, r, trap) {

    G.rec.turns.push({ p, pit: move.pit, dir: move.dir, took: r.captured, trap: mineTrap ? trap.kind : null, warned: human ? G.warnedThisTurn || null : null });
    G.warnedThisTurn = null;

  function gamesFor(name) { return games.filter((g) => (g.game || 'awale') === GAME && g.players.some((p, i) => p === name && g.computer !== i)); }

    if (v.dataset.src === src) return;
    const wasPlaying = !v.paused;
    v.dataset.src = src; v.poster = 'video/bao-rules-' + I18n.lang + '.jpg'; v.src = src;
    if (wasPlaying) v.play().catch(() => {});
  }
  function bindSettings() {
    const bind = (id, key, isCheck) => {
      const el = $(id);
      if (isCheck) el.checked = !!settings[key]; else el.value = settings[key];
      el.addEventListener('change', () => {
        settings[key] = isCheck ? el.checked : el.value; saveSettings();
        if (key === 'first' && G.mode === 'cpu' && G.log.length === 0) newGame();
        render();
      });
    };
    bind('opt-adaptive', 'adaptive', true); bind('opt-ratings', 'ratings', true); bind('opt-speed', 'speed'); bind('opt-first', 'first');
    const levelBtns = document.querySelectorAll('#difficulty button');
    const syncLevel = () => levelBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.level === settings.level)));
    levelBtns.forEach((b) => b.addEventListener('click', () => { settings.level = b.dataset.level; saveSettings(); syncLevel(); renderLevelNote(); }));
    syncLevel(); renderLevelNote();
    const warn = $('btn-warn');
    syncWarn = () => { warn.setAttribute('aria-checked', String(!!settings.coach)); $('warn-state').textContent = t(settings.coach ? 'warn.on' : 'warn.off'); };
    warn.addEventListener('click', () => { settings.coach = !settings.coach; saveSettings(); syncWarn(); if (!settings.coach) { G.pending = null; G.afterNote = null; } render(); });
    syncWarn();
    // Learner / advanced rules switch: only the learners' rules exist so far.
    $('rules-advanced').addEventListener('click', () => {
      $('rules-note').textContent = t('bao.advancedSoon');
      $('rules-note').classList.add('flash-note');
    });
    $('rules-learner').addEventListener('click', () => { $('rules-note').textContent = t('bao.learnerNote'); });
  }

  function start() {
    $('mode-puzzle').hidden = !PREMIUM || !PUZZLES.length;
    $('games-copy').hidden = true;
    I18n.setLang(settings.lang || I18n.detect());
    applyStatic();
    $('video-start').addEventListener('click', () => setMode('learn'));
    setVideoSource();
    $('lang-select').addEventListener('change', (e) => setLanguage(e.target.value));
    buildBoard(); bindSettings(); bindWelcome(); bindGames();
    $('pz-prev').onclick = () => loadPuzzle(PZ.index - 1);
    $('pz-next-card').onclick = () => loadPuzzle(PZ.index + 1);
    $('pz-today').onclick = () => loadPuzzle(dailyIndex());
    for (const b of document.querySelectorAll('.modes button')) b.addEventListener('click', () => setMode(b.dataset.mode));
    $('btn-new').onclick = newGame; $('end-new').onclick = newGame; $('btn-undo').onclick = undo; $('btn-hint').onclick = hint;
    $('lesson-prev').onclick = () => loadLesson(G.lesson - 1);
    $('lesson-retry').onclick = () => loadLesson(G.lesson);
    $('lesson-next').onclick = () => (G.lesson === LESSONS.length - 1 ? setMode('cpu') : loadLesson(G.lesson + 1));
    window.addEventListener('hashchange', () => {
      const m = location.hash.slice(1);
      if (m === 'video') setMode('video'); else if (['learn', 'puzzle', 'cpu', 'duo'].includes(m) && m !== G.mode) setMode(m);
    });
    const m = location.hash.slice(1);
    const wanted = ['learn', 'puzzle', 'cpu', 'duo'].includes(m) ? m : 'learn';
    setMode(wanted === 'duo' && !settings.opponent ? 'cpu' : wanted);
    if (m === 'video') showVideo(true);
    // Coming from the Awale page in the same visit: don't ask who's playing again.
    let ses = null;
    try { ses = sessionStorage.getItem('awale.session'); } catch (e) { /* ignore */ }
    if (ses && players.includes(ses)) { settings.me = ses; saveSettings(); renderMatchup(); renderGames(); }
    else openWelcome('me', false);
  }

  window.BaoApp = { get game() { return G; }, setMode, loadLesson };
  start();
})();
</script>
</body>
</html>
